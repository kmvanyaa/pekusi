[project]
name = "obshak-bot"
version = "0.1.0"
description = "Telegram-бот сервиса совместных финансов «Общак»"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0",
    "aioodbc>=0.5",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
